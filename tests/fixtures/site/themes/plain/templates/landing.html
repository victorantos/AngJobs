<article class="landing">
<h1>{{ page.title }}</h1>
{{#if page.heroCtaUrl}}<a class="btn" data-cta="hero" href="{{ page.heroCtaUrl }}">{{#if page.heroCtaLabel}}{{ page.heroCtaLabel }}{{else}}Get started{{/if}}</a>
{{/if}}{{{ page.content }}}
{{#if collections.features}}<ul class="features">
{{#each collections.features as feature}}<li data-slug="{{ feature.slug }}"><h3>{{ feature.title }}</h3>{{{ feature.content }}}</li>
{{/each}}</ul>
{{/if}}</article>
